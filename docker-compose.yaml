services:
  postgres_db:
    image: postgres:18
    container_name: postgres_18_container

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      POSTGRES_DB: eshop_local

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop_local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

    restart: unless-stopped

volumes:
  pgdata: